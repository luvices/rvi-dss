<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Vulnerability Intelligence (RVI)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-shape circle-1"></div>
    <div class="bg-shape circle-2"></div>
    <div class="bg-shape circle-3"></div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">🔮</span>
                <h1>RVI <span class="highlight">Intelligence</span></h1>
            </div>
            <p class="subtitle">Regional Vulnerability Analysis Dashboard</p>
        </header>

        <!-- KPI Metrics -->
        <section class="kpi-grid" id="kpi-container">
            <!-- Metrics will be injected here -->
        </section>

        <!-- Charts Section -->
        <section class="charts-grid">
            <div class="glass-panel chart-container">
                <h2>📈 Tren Produksi Padi (Ton)</h2>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="glass-panel chart-container">
                <h2>🎯 Feature Importance</h2>
                <canvas id="importanceChart"></canvas>
            </div>
        </section>

        <!-- Raw Data Table -->
        <section class="data-table glass-panel">
            <h2>📊 Data Summary</h2>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Kabupaten / Kota</th>
                            <th>Tahun</th>
                            <th>Produksi (Ton)</th>
                            <th>Hujan (mm)</th>
                            <th>Suhu (°C)</th>
                            <th>IPM</th>
                            <th>Kemiskinan (%)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>
        
        <footer>
            <p>GEMASTIK Data Mining Project | Powered by Synthetic Data & Random Forest</p>
        </footer>
    </div>

    <script src="dashboard_data.js"></script>
    <script src="script.js"></script>
</body>
</html>
